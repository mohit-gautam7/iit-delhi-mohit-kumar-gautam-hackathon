[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskpulse-ai"
version = "0.1.0"
description = "AI/NLP financial risk signal engine with event-driven portfolio stress testing (hackathon prototype)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohit Kumar Gautam" }]
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
